name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python pin ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run import checks
        run: uv run python -c "
          from xeno.runtime import XenoRuntime;
          from xeno.brain.orchestrator import BrainOrchestrator;
          from xeno.memory.unified import UnifiedMemoryManager;
          from xeno.protocols import MCP2025Client, A2AClient, AGNTCYClient, UMPAccessController;
          from xeno.server.gateway import GatewayAPI;
          from xeno.server.task_queue import TaskQueue;
          from xeno.self_improve.evolution import EvolutionEngine;
          from xeno.brain.prompt_tiers import PromptTierBuilder;
          print('All imports OK')
        "

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --timeout=30

      - name: Run health check
        continue-on-error: true
        run: uv run python main.py --check

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check syntax
        run: uv run python -m compileall xeno/ tests/
